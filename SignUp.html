<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@100..1000&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
        }

        #logo {
            position: relative;
            top: 10px;
            left: -290px;
        }

        .left {
            display: inline-block;
            width: 60vw;
            height: 100vh;
            text-align: center;
            color: black;
        }

        .lcont {
            position: relative;
            top: -10px;
        }

        .heading {
            font-size: 27px;
            margin-top: 40px;
            font-family: "Afacad Flux", sans-serif;
            font-optical-sizing: auto;
            font-weight: 500;
            font-style: normal;
            font-variation-settings: "slnt" 0;
        }

        .input {
            margin: 8px;
            height: 34px;
            width: 300px;
            border-radius: 10px;
            border: 1px;
            background-color: rgb(208, 237, 223);
        }

        #submit {

            margin: 15px;
            width: 280px;
            height: 30px;
            background-color: rgb(22, 197, 174);
            border: 0px;
            border-radius: 20px;
            color: rgb(255, 255, 255);
            transition-property: all;
            transition-duration: 0.1s;
            transition-timing-function: ease;
        }

        #submit:hover {
            position: relative;
            top: -5px;
            background-color: rgb(4, 180, 154);
            width: 290px;
            height: 35px;
        }

        .right {
            position: absolute;
            display: inline-block;
            width: 38vw;
            height: 100vh;
            background-color: rgb(22, 197, 174);
            color: white;
        }

        .rtext {
            margin-top: 250px;
            text-align: center;
        }

        .head {
            font-size: 50px;
            font-weight: 600;
            font-family: "Afacad Flux", sans-serif;
            font-optical-sizing: auto;
            font-weight: 500;
            font-style: normal;
            font-variation-settings: "slnt" 0;
        }

        .text {

            position: relative;
            width: 500px;
            font-size: 20px;
        }

        .login {
            width: 180px;
            height: 30px;
            border-radius: 20px;
            border: 0px;
            color: rgb(22, 197, 174);
            transition: all 0.1s ease-in-out;
        }

        .login:hover {

            font-size: 18px;
            width: 190px;
            height: 40px;
        }

        #glogo {
            position: relative;
            left: 3px;
        }

        .slogo {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slogo img {
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .slogo img:hover {
            transform: scale(1.2);
        }
    </style>
</head>

<body>

    <div class="left">
        <div>
            <img src="src/assets/TravelobeLogo.png" alt="Logo" width="150px" id="logo">
        </div>


        <div class="slogos">
            <div class="heading">
                <h1>Create your account</h1>
            </div>
            <div>Sign up using social networks</div>
            <div class="slogo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b9/2023_Facebook_icon.svg" alt="f"
                    width="30px">
                <img src="https://cdn1.iconfinder.com/data/icons/google-s-logo/150/Google_Icons-09-512.png" alt="g"
                    width="50px" id="glogo">
            </div>
        </div>
        <div>or</div>



        <form action="" id="fom">


            <div>
                <input type="text" id="name" placeholder="  Username" class="input" required>
            </div>
            <div>

                <input type="email" id="email" placeholder="  Email" class="input" required>

            </div>
            <div>
                <input type="tel" id="no" placeholder="  Mobile no" class="input">
            </div>
            <div>
                <input type="password" id="pass1" placeholder="  Password" class="input">
            </div>
            <div>
                <input type="password" id="pass2" placeholder="  Confirm Passowrd" class="input">
            </div>
            <input type="checkbox" id="terms">
            <label for="terms" class="black">I agree to the terms and conditions and follow all the rules and
                regulations</label>
            <div>
                <input type="submit" value="Sign Up" id="submit" onclick="authenticate()">
            </div>

        </form>
    </div>

    </div>
    <div class="right">

        <div class="rtext">

            <p class="head">Already a member?</p>

            <p class="text">Login with your account</p>

            <div>
                <input type="submit" value="Login" class="login">
            </div>
        </div>

    </div>

    <script src="val.js"></script>

</body>

</html>
